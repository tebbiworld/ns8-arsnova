# JNDI defaults of the ARSnova core, mounted read-only as
# <java.home>/conf/jndi.properties (arsnova-core.service). JNDI merges this
# file into the environment of every initial context, also of the LDAP
# contexts that Spring Security creates for the directory login.
#
# ARSnova 3.13 only sets the LDAP connect timeout (CONNECTTIMEOUT in
# ldap.env). Without a read timeout a server that accepts the connection but
# does not answer keeps the login waiting until the gateway gives up (504
# after 60 s). This happens with a user domain: the node's ldapproxy accepts
# at once and then waits up to 60 s for an unreachable domain controller.
# Milliseconds per LDAP request (bind, search).
com.sun.jndi.ldap.read.timeout=10000
