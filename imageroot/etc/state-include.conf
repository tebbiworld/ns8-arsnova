# Paths included in the module backup (state/environment is always included).
#   state/passwords.env          generated secrets and the LDAP bind password
#   state/pgdump                 pg_dump of the two PostgreSQL databases (module-dump-state)
#   arsnova-couchdb              CouchDB data (rooms, contents, answers); CouchDB files
#                                are append-only, a file-level copy is consistent
# The live PostgreSQL data directories are NOT copied: restore-module rebuilds
# them from the dumps.
state/passwords.env
state/pgdump
volumes/arsnova-couchdb
